services:
  - type: web
    name: wpm-ksrtc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false        # set this in Render dashboard
      - key: FRAME_DIR
        sync: false        # optional; falls back to static/sample_frames
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: wpm-data
      mountPath: /data
      sizeGB: 1